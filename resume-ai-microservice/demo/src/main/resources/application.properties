spring.application.name=ai-inference-service
server.port=8081

# --- Spring AI Ollama Configuration ---
# The URL where your local Ollama instance is running (default is 11434)
spring.ai.ollama.base-url=http://localhost:11434

# The specific model you want to use.
# RUN 'ollama list' in your terminal to verify the exact name you have installed.
spring.ai.ollama.chat.options.model=deepseek-r1:1.5b

# Optional: Adjust creativity (0.0 is strict, 1.0 is creative)
spring.ai.ollama.chat.options.temperature=0.7